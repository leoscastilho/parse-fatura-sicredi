server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    client_max_body_size 32M;   # extratos são pequenos, mas dá pra mandar vários

    gzip on;
    gzip_types text/css application/javascript application/json text/csv;
    gzip_min_length 1024;

    # O front chama sempre /api/... relativo. O nginx tira o prefixo e manda
    # pro FastAPI pelo nome do serviço no compose. Assim não existe CORS em
    # produção e a mesma imagem sobe em qualquer host, sem rebuild.
    location /api/ {
        proxy_pass         http://backend:8000/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # O /upload pode demorar alguns segundos com vários extratos.
        proxy_connect_timeout 10s;
        proxy_read_timeout    120s;
        proxy_buffering       off;   # deixa o CSV do /export fluir
    }

    # SPA: qualquer rota desconhecida devolve o index.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
