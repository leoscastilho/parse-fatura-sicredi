# =============================================================================
#  Regras de categorização — parser-de-fatura-multibancos
# =============================================================================
#
#  COMO FUNCIONA (na ordem):
#
#  0. A descrição do lançamento é NORMALIZADA antes de qualquer comparação:
#     MAIÚSCULAS, sem acentos, pontuação virando espaço, espaços colapsados,
#     e CamelCase separado.
#         "Prudent*APOL00188798"  ->  "PRUDENT APOL00188798"
#         "OggiSantaRita"         ->  "OGGI SANTA RITA"
#     Escreva as palavras-chave em MAIÚSCULAS e sem acentos.  A comparação
#     também ignora espaços, então GRELHA GRILL acha "GrelhaGrill".
#
#  1. `excluir`       -> se casar, a linha é DESCARTADA (não vai pro CSV).
#  2. `regras`        -> lista ORDENADA; a primeira que casar vence.
#                        Use aqui os casos específicos que precisam ganhar de
#                        uma palavra-chave genérica de `palavras`.  Aceita regex.
#  3. `palavras`      -> mapa  Categoria -> [trechos].  Vence o trecho MAIS
#                        LONGO que casar (o mais específico).  A ordem aqui
#                        não importa, o que facilita editar.
#  4. `marketplaces`  -> Categoria VAZIA de propósito (ver abaixo).
#  5. nada casou      -> Categoria fica VAZIA e a linha vai pro fim do CSV.
#
#  `desconhecidos`  -> estabelecimentos que você já disse que não sabe
#                      classificar.  Saem com categoria vazia e o
#                      `categorize.py` não pergunta de novo.  Apague uma linha
#                      de lá para voltar a ser perguntado.
#
#  `marketplaces`   -> Amazon, Mercado Livre e afins.  Categoria sai VAZIA de
#                      propósito (varia a cada compra), o categorize.py não
#                      pergunta, e o relatório marca como MARKETPLACE.
#
#  PARA ADICIONAR UMA CATEGORIA NOVA: acrescente a chave em `palavras` (e em
#  `configuracao.categorias`, para ela já aparecer na lista do categorize.py).
#  O `main.py` não precisa ser tocado.
#
#  Linhas marcadas com  # ?  são chutes — confirme ou corrija.
# =============================================================================

configuracao:
  # Vazio de propósito: o que não casar com nada fica sem categoria e vai pro
  # fim do CSV, para você resolver no `categorize.py`.
  categoria_padrao: ""

  # Colapsa espaços múltiplos dentro da descrição ("DM      *Nintend" ->
  # "DM *Nintend"). Ponha `false` para manter byte a byte como vem do Sicredi.
  colapsar_espacos: true

  # ---------------------------------------------------------------------------
  #  Categorias que o portal NÃO atribui e NÃO reescreve.
  #
  #  Elas não dizem o que foi comprado, dizem para onde o dinheiro se moveu. Na
  #  planilha, `Renda Fixa`, `Renda Variável` e `Resgate Poupança` são SOMADAS e
  #  todo o resto é subtraído; `Poupança` e `Investimento` são dinheiro guardado,
  #  não consumido.
  #
  #  A regra de categorização lê a DESCRIÇÃO e procura nome de estabelecimento —
  #  ela responde "o que foi comprado", que é a outra pergunta. Quando as duas se
  #  cruzam, o resultado é o oposto do certo. Medido no histórico (6.712 linhas):
  #  as regras de hoje querem trocar 73 linhas destas, R$ 45.179. Entre elas,
  #  `Presente da Vó Marta` (dinheiro RECEBIDO, Renda Variável) virando
  #  `Presentes`, e `Cashback Picpay` virando `Ajuste` — cada troca tira o valor
  #  do lado somado e o joga no subtraído, um erro de duas vezes o valor.
  #
  #  Efeito em três lugares:
  #    * a recategorização nunca propõe trocar a categoria de uma linha destas;
  #    * elas não aparecem nos seletores de Novos, Marketplace, conferência e
  #      viagem — não dá para atribuí-las a uma compra de fatura;
  #    * a linha que JÁ está numa delas continua mostrando a sua, sempre.
  #
  #  Elas continuam na lista `categorias` acima de propósito: o `categorize.py`
  #  e os editores de regra precisam do nome completo.
  #
  #  Estes mesmos nomes aparecem em `papeis:` no analytics.yml, que é o que a aba
  #  de Análise usa para somar. Renomeou na planilha? Mude nos dois arquivos.
  # ---------------------------------------------------------------------------
  categorias_fixas:
    - Renda Fixa
    - Renda Variável
    - Resgate Poupança
    - Poupança
    - Investimento

  # Lista oferecida pelo `categorize.py`. Mantenha igual à da planilha.
  categorias:
    - Ajuste
    - Alimentação
    - Assinaturas
    - Cachorro
    - Cartão de crédito
    - Casa
    - Construção
    - Educação
    - Eletrônicos
    - Filha
    - Hobby
    - Imposto
    - Investimento
    - Lazer
    - Outros
    - Poupança
    - Presentes
    - Renda Fixa
    - Renda Variável
    - Resgate Poupança
    - Restante
    - Saúde
    - Seguros
    - Serviços
    - Transporte
    - Vestuário
    - Viagem


# -----------------------------------------------------------------------------
# 1. LINHAS DESCARTADAS
#    O pagamento da fatura anterior não é uma despesa — você lança ele à mão
#    na planilha como "Cartão de crédito".
# -----------------------------------------------------------------------------
excluir:
  - PAGAMENTO DEBITO
  - PAG FAT DEB CC
  - PAGAMENTO EFETUADO
  - PAGTO FATURA


# -----------------------------------------------------------------------------
# 2. REGRAS ORDENADAS (primeira que casar vence) — casos específicos
# -----------------------------------------------------------------------------
regras:
  # -- Estornos e créditos: têm que vir antes de "ANUIDADE" -------------------
  - padrao: "CREDITO ANUIDADE"
    categoria: Ajuste
  - padrao: "DEVOLUCAO DE COMPRAS|ESTORNO|CASHBACK|DESCONTO ANTECIPACAO|VARIACAO CAMBIAL"
    categoria: Ajuste

  # -- IOF é imposto (seu histórico registra "IOF de ..." em Imposto) ---------
  - padrao: "^IOF"
    categoria: Imposto

  # -- Mercado Livre: sub-lojas identificáveis ganham do genérico -------------
  - padrao: "MERCADOLIVRE (LIVROS|LEITURA)"
    categoria: Educação
  - padrao: "MERCADOLIVRE (TECHSH|ESPLAN)"
    categoria: Eletrônicos
  - padrao: "MERCADOLIVRE GROW"
    categoria: Hobby          # ? Grow = jogos de tabuleiro
  - padrao: "AMAZONMKTPLC EMPORIO"
    categoria: Alimentação
  - padrao: "AMAZON ?PRIME"
    categoria: Assinaturas    # assinatura, não compra no marketplace
  - padrao: "AMAZON ?(MUSIC|KINDLE)"
    categoria: Assinaturas

  # -- Postos: "POSTO" genérico é transporte ---------------------------------
  - padrao: "(AUTO |RODO )?POSTO "
    categoria: Transporte
  - padrao: '\b(LUZ|AGUA|GAS|INTERNET|BOTIJAO|CONDOMINIO)\b'
    categoria: Casa    # contas fixas da casa; palavra inteira para nao pegar CRUZ/AGUAS/GASOLINA
  - padrao: '\b(IFOOD|MERCADO (DA|DE|DO)|ACOUGUE|HORTIFRUTI|QUITANDA)\b'
    categoria: Alimentação    # MERCADO (DA|DE|DO) evita casar com MERCADOLIVRE
  - padrao: '\b(IPIRANGA|LAVA(GEM|R) (DO )?CARRO|DPVAT|LICENCIAMENTO)\b'
    categoria: Transporte    # carro: combustivel, lavagem e taxas
  - padrao: '\b(REMEDIO|EXAME DE SANGUE|VITAMINA|ROACUTAN)\b'
    categoria: Saúde    # ? remedio do cachorro cai aqui por engano; confira Cachorro
  - padrao: '\b(ROUPAS|CUECA|CAMISETA|SHORTS?|MEIAS)\b'
    categoria: Vestuário    # so o plural ROUPAS: "roupa de cama" e Casa


