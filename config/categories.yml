# -----------------------------------------------------------------------------
# 4. MARKETPLACES — categoria em branco, de propósito
#    Amazon e Mercado Livre vendem de ração a monitor: a categoria muda a cada
#    compra, então gravar uma palavra-chave seria errado na maioria das vezes.
#    Saem com Categoria VAZIA, o categorize.py não pergunta (não há resposta
#    única a gravar), e aparecem no relatório marcados como MARKETPLACE para
#    você preencher na planilha.
#
#    As sub-lojas identificáveis ficam em `regras` lá em cima e ganham destas
#    aqui — MERCADOLIVRE LIVROS vira Educação, MERCADOLIVRE GROW vira Hobby.
# -----------------------------------------------------------------------------
